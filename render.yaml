# Render Blueprint Configuration for Nagar Drishti (नगर दृष्टि)
# https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # FastAPI Central Command Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: nagar-drishti-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AI_MODE
        value: SIMULATION
      - key: CITY_NAME
        value: Pune Metropolitan Region
      - key: SECRET_KEY
        generateValue: true
