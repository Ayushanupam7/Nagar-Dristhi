# Render Blueprint Configuration for Nagar Drishti (नगर दृष्टि)
# https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # 1. FastAPI Central Command Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: nagar-drishti-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: AI_MODE
        value: SIMULATION
      - key: CITY_NAME
        value: Pune Metropolitan Region
      - key: SECRET_KEY
        generateValue: true

  # -------------------------------------------------------------
  # 2. React + Vite Frontend Static Web Application
  # -------------------------------------------------------------
  - type: web
    name: nagar-drishti-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      # SPA rewrite rule so React Router handles all subpaths
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nagar-drishti-backend
          property: host
